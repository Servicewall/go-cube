cube:
  name: AccessRawView
  sql_table: default.access

  segments:
    org:
      sql: ""

    black:
      sql: ""

  dimensions:
    id:
      sql: id
      type: string
      title: ID

    ts:
      sql: ts
      type: time
      title: 时间

    url:
      sql: url
      type: string
      title: URL

    gorId:
      sql: JSONExtractString(req_head, 'Gor-Msg-Id', 1)
      type: string
      title: GorID

    request:
      sql: toJSONString(map('Host',host,'Method',method,'Path',url,'Header',if(empty(req_head),'',CAST(req_head,'JSON')),'Query',if(empty(url_param),'',CAST(url_param,'JSON')),'Body',if(isValidJSON(req_body),JSONExtract(req_body,'Dynamic'),if(length(req_body)>100000, subStr(req_body,1,100000) || '......', req_body))))
      sql_mask: toJSONString(map('Host',host,'Method',method,'Path',url,'Header',if(empty(req_head),'',CAST(req_head,'JSON')),'Query',if(empty(url_param),'',CAST(url_param,'JSON')),'Body',if(isValidJSON(arrayFold((acc, v) -> replaceAll(acc, v, '***'), req_sens_v, req_body)),JSONExtract(arrayFold((acc, v) -> replaceAll(acc, v, '***'), req_sens_v, req_body),'Dynamic'),arrayFold((acc, v) -> replaceAll(acc, v, '***'), req_sens_v, if(length(req_body)>100000, subStr(req_body,1,100000) || '......', req_body)))))
      type: string
      title: 请求原文

    response:
      sql: toJSONString(map('Status',status,'Header',if(empty(res_head),'',CAST(res_head,'JSON')),'Body',if(isValidJSON(res_body),JSONExtract(res_body,'Dynamic'),if(length(res_body)>100000, subStr(res_body,1,100000) || '......', res_body))))
      sql_mask: toJSONString(map('Status',status,'Header',if(empty(res_head),'',CAST(res_head,'JSON')),'Body',if(isValidJSON(arrayFold((acc, v) -> replaceAll(acc, v, '***'), res_sens_v, res_body)),JSONExtract(arrayFold((acc, v) -> replaceAll(acc, v, '***'), res_sens_v, res_body),'Dynamic'),arrayFold((acc, v) -> replaceAll(acc, v, '***'), res_sens_v, if(length(res_body)>100000, subStr(res_body,1,100000) || '......', res_body)))))
      type: string
      title: 响应原文

    # 文件内容预览（下载取 res_body，上传取 req_body）
    fileContent:
      sql: multiIf(url_action[1] = '下载', res_body, url_action[1] = '上传', req_body, '')
      sql_mask: "arrayFold((acc, v) -> replaceAll(acc, v, '***'), arrayConcat(req_sens_v, res_sens_v), multiIf(url_action[1] = '下载', res_body, url_action[1] = '上传', req_body, ''))"
      type: string
      title: 文件内容预览
