cube:
  name: AccessRawView
  sql_table: default.access_raw

  segments:
    org:
      sql: ""

    black:
      sql: ""

  dimensions:
    id:
      sql: id
      type: string
      title: ID

    ts:
      sql: ts
      type: time
      title: 时间

    url:
      sql: url
      type: string
      title: URL

    gorId:
      sql: JSONExtractString(req_head, 'Gor-Msg-Id', 1)
      type: string
      title: GorID

    # 请求原文：WS/TCP 等二进制协议 Body 原样返回，其余 Body 超 100000 字节时截断
    request:
      sql: toJSONString(map('Host',host,'Method',method,'Path',url,'Header',req_head,'Body',if(substr(method,-3) IN ['C2S','S2C','TCP','WS'], req_body, if(length(req_body)>100000, subStr(req_body,1,100000), req_body))))
      sql_mask: "toJSONString(map('Host',host,'Method',method,'Path',url,'Header',req_head,'Body',arrayFold((acc, v) -> replaceAll(acc, v, concat(substr(v,1,1),'***',substr(v,length(v),1))), req_sens_v, if(substr(method,-3) IN ['C2S','S2C','TCP','WS'], req_body, if(length(req_body)>100000, subStr(req_body,1,100000), req_body)))))"
      type: string
      title: 请求原文

    # 响应原文：Body 超 100000 字节时截断并追加 '......'
    response:
      sql: toJSONString(map('Status',status,'Header',res_head,'Body',if(length(res_body)>100000, subStr(res_body,1,100000) || '......', res_body)))
      sql_mask: "toJSONString(map('Status',status,'Header',res_head,'Body',arrayFold((acc, v) -> replaceAll(acc, v, concat(substr(v,1,1),'***',substr(v,length(v),1))), res_sens_v, if(length(res_body)>100000, subStr(res_body,1,100000) || '......', res_body))))"
      type: string
      title: 响应原文

    # 文件内容预览（下载取 res_body，上传取 req_body）
    fileContent:
      sql: multiIf(url_action[1] = '下载', res_body, url_action[1] = '上传', req_body, '')
      sql_mask: "arrayFold((acc, v) -> replaceAll(acc, v, concat(substr(v,1,1),'***',substr(v,length(v),1))), arrayConcat(req_sens_v, res_sens_v), multiIf(url_action[1] = '下载', res_body, url_action[1] = '上传', req_body, ''))"
      type: string
      title: 文件内容预览
